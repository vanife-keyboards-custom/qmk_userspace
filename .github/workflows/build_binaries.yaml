name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master
      # The Cheapino is not in upstream QMK: link our vendored board definition into
      # the checked-out tree before `qmk userspace-compile` (same as kboards'
      # scripts/link-cheapino.sh does locally). See vendor/keyboards/cheapino/VENDORING-DIFF.html.
      preparation_command: ln -s ../../vendor/keyboards/cheapino qmk_firmware/keyboards/cheapino

  publish:
    name: 'QMK Userspace Publish'
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
    if: always() && !cancelled()
    needs: build
